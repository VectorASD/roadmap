<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Distance to segment</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #111;
        user-select: none;
        font-family: monospace;
    }
    canvas {
        display: block;
        width: 100%; height: 100%;
        cursor: crosshair;
        touch-action: none;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W = 0, H = 0;
const A = { x: 520, y: 320 };
const B = { x: 1100, y: 620 };
let P = { x: 400, y: 300 };

function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width    = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width    = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    render();
}

function localPos(e) {
    const r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointermove', e => {
    P = localPos(e);
    render();
});

// Координаты P в системе отрезка AB:
// X — вдоль AB, Y — перпендикуляр (CCW от направления AB)
function segmentCoords(P, A, B) {
    const dx = B.x - A.x, dy = B.y - A.y;
    const len = Math.hypot(dx, dy);
    const ux = dx / len, uy = dy / len;
    const px = P.x - A.x, py = P.y - A.y;
    const X = px * ux + py * uy;
    const Y = px * (-uy) + py * ux;
    return { X, Y, len, ux, uy };
}

function render() {
    ctx.clearRect(0, 0, W, H);

    // сетка
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 1;
    for (let x = 0; x < W; x += 50) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
    }
    for (let y = 0; y < H; y += 50) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
    }

    // отрезок AB
    ctx.strokeStyle = '#4af';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(A.x, A.y);
    ctx.lineTo(B.x, B.y);
    ctx.stroke();

    // точки A и B
    ctx.fillStyle = '#4af';
    ctx.beginPath(); ctx.arc(A.x, A.y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(B.x, B.y, 5, 0, Math.PI * 2); ctx.fill();

    ctx.font = '14px monospace';
    ctx.fillText('A', A.x + 8, A.y - 8);
    ctx.fillText('B', B.x + 8, B.y - 8);

    // локальные координаты
    const { X, Y, len, ux, uy } = segmentCoords(P, A, B);

    // проекция P на отрезок AB
    const projX = X < 0 ? A.x : X > len ? B.x : A.x + ux * X;
    const projY = X < 0 ? A.y : X > len ? B.y : A.y + uy * X;

    // пунктир от P до проекции
    ctx.strokeStyle = '#f80';
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(P.x, P.y);
    ctx.lineTo(projX, projY);
    ctx.stroke();
    ctx.setLineDash([]);

    // точка проекции
    ctx.fillStyle = '#f80';
    ctx.beginPath(); ctx.arc(projX, projY, 3, 0, Math.PI * 2); ctx.fill();

    // точка P
    ctx.fillStyle = '#f44';
    ctx.beginPath(); ctx.arc(P.x, P.y, 6, 0, Math.PI * 2); ctx.fill();

    // расстояние до отрезка по трём случаям
    const dist = Math.hypot(P.x - projX, P.y - projY);
    const closest = X < 0 ? 'A' : (X > len ? 'B' : 'проекция');

    // инфа в углу
    ctx.fillStyle = '#eee';
    ctx.font = '14px monospace';
    const lines = [
        `P = (${P.x.toFixed(1)}, ${P.y.toFixed(1)})`,
        `X = ${X.toFixed(1)}     Y = ${Y.toFixed(1)}     |AB| = ${len.toFixed(1)}`,
        `расстояние = ${dist.toFixed(2)}    (до ${closest})`,
    ];
    let ty = 24;
    for (const line of lines) {
        ctx.fillText(line, 16, ty);
        ty += 20;
    }
}

window.addEventListener('resize', resize);
resize();
</script>
</body>
</html>
