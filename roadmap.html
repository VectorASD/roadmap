<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Distance to segment</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden;
        background: #111;
        user-select: none;
        font-family: monospace;
    }
    canvas {
        display: block;
        width: 100%; height: 100%;
        cursor: crosshair;
        touch-action: none;
    }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

class Point {
    constructor(x = 0, y = 0) { this.x = x; this.y = y; }
    set(x, y)  { this.x = x; this.y = y; return this; }
    setFrom(p) { this.x = p.x; this.y = p.y; return this; }
    clone()    { return new Point(this.x, this.y); }
    distTo(p)  { return Math.hypot(this.x - p.x, this.y - p.y); }
}

class Line {
    constructor(a = new Point(), b = new Point(), name = '') {
        this.a = a;
        this.b = b;
        this.name = name;
    }

    metrics() {
        const dx = this.b.x - this.a.x, dy = this.b.y - this.a.y;
        const len = Math.hypot(dx, dy);
        if (len === 0) return { len: 0, ux: 0, uy: 0 };
        return { len, ux: dx / len, uy: dy / len };
    }

    // Координаты точки в системе отрезка: X вдоль, Y перпендикуляр (CCW)
    segmentCoords(p) {
        const { len, ux, uy } = this.metrics();
        if (len === 0) return { X: 0, Y: 0, len: 0, ux: 0, uy: 0 };
        const px = p.x - this.a.x, py = p.y - this.a.y;
        return {
            X: px * ux + py * uy,
            Y: px * (-uy) + py * ux,
            len, ux, uy,
        };
    }

    // Ближайшая точка на отрезке. Возвращает Point с .dist и .t
    closestOnSegment(p) {
        const dx = this.b.x - this.a.x;
        const dy = this.b.y - this.a.y;
        const len2 = dx * dx + dy * dy;
        let t = len2 === 0 ? 0
            : ((p.x - this.a.x) * dx + (p.y - this.a.y) * dy) / len2;
        t = Math.max(0, Math.min(1, t));
        const hit = new Point(this.a.x + t * dx, this.a.y + t * dy);
        hit.dist = p.distTo(hit);
        hit.t = t;
        return hit;
    }

    draw(ctx, opts = {}) {
        const {
            color = '#4af', dash = null,
            dotStart = true, startColor  = color, startRadius = 5,
            dotEnd   = true, endColor    = color, endRadius   = 5,
        } = opts;

        const labelStart = this.name[0] ?? '';
        const labelEnd   = this.name[1] ?? '';

        if (dash) ctx.setLineDash(dash);
        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(this.a.x, this.a.y);
        ctx.lineTo(this.b.x, this.b.y);
        ctx.stroke();
        if (dash) ctx.setLineDash([]);

        ctx.font = '14px monospace';
        if (dotStart) {
            ctx.fillStyle = startColor;
            ctx.beginPath();
            ctx.arc(this.a.x, this.a.y, startRadius, 0, Math.PI * 2);
            ctx.fill();
            if (labelStart) ctx.fillText(labelStart, this.a.x + 8, this.a.y - 8);
        }
        if (dotEnd) {
            ctx.fillStyle = endColor;
            ctx.beginPath();
            ctx.arc(this.b.x, this.b.y, endRadius, 0, Math.PI * 2);
            ctx.fill();
            if (labelEnd) ctx.fillText(labelEnd,   this.b.x + 8, this.b.y - 8);
        }
    }
}

class Arrow extends Line {
    constructor(a = new Point(), b = new Point(), name = '') {
        super(a, b, name);  // arrow IS the AB line
        this.c  = new Point();
        this.d  = new Point();
        this.bc = new Line(b, this.c, 'BC');
        this.bd = new Line(b, this.d, 'BD');
        this.updateBarbs();
    }

    // Пересчитывает C и D из текущих A и B. Мутирует существующие Points,
    // поэтому bc/bd держат валидные ссылки без пересоздания.
    updateBarbs() {
        const { len, ux, uy } = this.metrics();
        const c45 = Math.SQRT1_2;
        const barb = len / 4;
        this.c.set(
            this.b.x + c45 * barb * ( uy - ux),
            this.b.y + c45 * barb * (-ux - uy),
        );
        this.d.set(
            this.b.x + c45 * barb * (-ux - uy),
            this.b.y + c45 * barb * ( ux - uy),
        );
        return this;
    }

    // Сеттеры - единственный безопасный способ двинуть C и D.
    // Прямая мутация a.x/a.y возможна, но тогда придётся руками трогать updateBarbs().
    setA(p)   { this.a.setFrom(p); return this.updateBarbs(); }
    setB(p)   { this.b.setFrom(p); return this.updateBarbs(); }
    set(a, b) { this.a.setFrom(a); this.b.setFrom(b); return this.updateBarbs(); }

    // Ближайшая точка на всей стрелке (AB, BC, BD).
    // Возвращает Point с .dist, .t и .line (какая из трёх линий).
    closest(p) {
        const hits = [this, this.bc, this.bd].map(line => {
            const hit = line.closestOnSegment(p);
            hit.line = line;
            return hit;
        });
        return hits.reduce((a, b) => a.dist <= b.dist ? a : b);
    }

    draw(ctx, opts = {}) {
        super.draw(ctx, opts);
        this.bc.draw(ctx, { dotStart: false });
        this.bd.draw(ctx, { dotStart: false });
    }
}


// Жадный перенос по словам. Возвращает массив строк.
function wrapText(ctx, text, maxWidth) {
    const words = String(text).split(/\s+/).filter(Boolean);
    const lines = [];
    let cur = '';
    for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (ctx.measureText(test).width <= maxWidth) {
            cur = test;
        } else {
            if (cur) lines.push(cur);
            cur = w;
        }
    }
    if (cur) lines.push(cur);
    return lines;
}


const CHECK_SIZE    = 16;
const CHECK_RADIUS  = 3;
const CHECK_COL_W   = 26;

const CHECK_COLORS = {
    todo:     { fill: '#ffffff', stroke: '#555555', mark: null      },
    doing:    { fill: '#ffffff', stroke: '#ffaa00', mark: '#ffaa00' },
    done:     { fill: '#ffffff', stroke: '#44aa44', mark: '#44aa44' },
    blocked:  { fill: '#ffffff', stroke: '#ff4444', mark: '#ff4444' },
    deferred: { fill: '#ffffff', stroke: '#888888', mark: null      },
    na:       { fill: '#888888', stroke: '#555555', mark: '#555555' },
};

function drawCheckbox(ctx, x, y, size, type) {
    const c = CHECK_COLORS[type] || CHECK_COLORS.todo;
    const r = CHECK_RADIUS;

    ctx.beginPath();
    ctx.roundRect(x, y, size, size, r);
    ctx.fillStyle = c.fill;
    ctx.fill();

    if (type === 'doing') {
        ctx.save();
        ctx.clip();
        ctx.fillStyle = c.stroke;
        ctx.fillRect(x, y, size / 2, size);
        ctx.restore();
    }

    ctx.beginPath();
    ctx.roundRect(x, y, size, size, r);
    ctx.strokeStyle = c.stroke;
    ctx.lineWidth = 1.5;
    if (type === 'deferred') ctx.setLineDash([2, 2]);
    ctx.stroke();
    ctx.setLineDash([]);

    if (type === 'done') {
        ctx.strokeStyle = c.mark;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + 3, y + size / 2);
        ctx.lineTo(x + size * 0.42, y + size - 4);
        ctx.lineTo(x + size - 3, y + 3);
        ctx.stroke();
        ctx.lineCap = 'butt';
    } else if (type === 'blocked') {
        ctx.strokeStyle = c.mark;
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x + 4, y + 4);
        ctx.lineTo(x + size - 4, y + size - 4);
        ctx.moveTo(x + size - 4, y + 4);
        ctx.lineTo(x + 4, y + size - 4);
        ctx.stroke();
        ctx.lineCap = 'butt';
    } else if (type === 'na') {
        ctx.strokeStyle = c.mark;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x + 3, y + size / 2);
        ctx.lineTo(x + size - 3, y + size / 2);
        ctx.stroke();
    }
}


const NODE_PAD    = 14;
const HEADER_H    = 28;
const ROW_GAP     = 8;
const TEXT_PAD    = 8;
const TEXT_MIN_W  = 200;
const TEXT_LINE_H = 18;

const NODE_HIT_THRESHOLD    = 8;
const NODE_RESIZE_THRESHOLD = 8;

class Node {
    constructor(opts) {
        this.point     = opts.point || new Point();
        this.title     = opts.title ?? '';
        this.checkCols = opts.checkCols ?? 1;
        this.textColW  = opts.textColW ?? TEXT_MIN_W;   // user target
        this.rows      = opts.rows ?? [];
        this._lines    = null;
        this._size     = null;
        this._bounds   = null;
        this._effectiveTextW = 0;
        this.rightEdge = new Line(new Point(), new Point());
        this._drag     = null;
    }
    get dragMode() { return this._drag?.mode ?? null; }

    measure(ctx) {
        ctx.font = '13px monospace';

        // 1. Собираем границы: naturalMax (вся строка в 1 линию)
        //    и longestWord (ниже нельзя, слова не ломаются)
        let naturalMax = 0;
        let longestWord = 0;
        for (const row of this.rows) {
            const t = String(row.text ?? '');
            const w = ctx.measureText(t).width;
            if (w > naturalMax) naturalMax = w;
            for (const word of t.split(/\s+/).filter(Boolean)) {
                const ww = ctx.measureText(word).width;
                if (ww > longestWord) longestWord = ww;
            }
        }

        // 2. Целевая ширина для wrap: user target, clamped
        let targetW;
        if (this.rows.length === 0) {
            targetW = 0;
        } else {
            targetW = Math.max(longestWord, Math.min(this.textColW, naturalMax));
        }

        // 3. Wrap по target
        this._lines = this.rows.map(row =>
            wrapText(ctx, String(row.text ?? ''), targetW)
        );

        // 4. Видимая ширина = max по фактическим строкам после wrap
        let actualW = 0;
        for (const lines of this._lines) {
            for (const line of lines) {
                const w = ctx.measureText(line).width;
                if (w > actualW) actualW = w;
            }
        }
        this._effectiveTextW = actualW;

        // 5. Дальше - layout по actualW, не по targetW
        ctx.font = 'bold 14px monospace';
        const titleW = ctx.measureText(this.title).width;

        const textColW = actualW + TEXT_PAD * 2;
        const bodyW = NODE_PAD * 2 + this.checkCols * CHECK_COL_W + textColW;
        const w = Math.max(bodyW, titleW + NODE_PAD * 2);

        let rowsH = 0;
        for (let i = 0; i < this._lines.length; i++) {
            rowsH += Math.max(CHECK_SIZE, this._lines[i].length * TEXT_LINE_H);
            if (i < this._lines.length - 1) rowsH += ROW_GAP;
        }
        const h = NODE_PAD + HEADER_H + ROW_GAP + rowsH + NODE_PAD;

        this._size = { w, h };
        this._bounds = {
            left:   this.point.x,
            top:    this.point.y,
            right:  this.point.x + w,
            bottom: this.point.y + h,
        };
        this.rightEdge.a.set(this._bounds.right, this._bounds.top);
        this.rightEdge.b.set(this._bounds.right, this._bounds.bottom);
        return this._size;
    }

    bounds() {
        if (!this._bounds) throw new Error('Node.measure(ctx) first');
        return this._bounds;
    }

    // Точка на прямоугольнике, ближайшая к p. Возвращает Point с .dist
    closest(p) {
        const { left, top, right, bottom } = this.bounds();
        const cx = p.x < left ? left : p.x < right ? p.x : right;
        const cy = p.y < top  ? top : p.y < bottom ? p.y : bottom;

        const hit = new Point(cx, cy);
        hit.dist = p.distTo(hit);
        return hit;
    }

    draw(ctx) {
        const { w } = this.measure(ctx);
        const { left: x, top: y, bottom } = this.bounds();

        // карточка
        ctx.beginPath();
        ctx.roundRect(x, y, w, bottom - y, 8);
        ctx.fillStyle = '#1a1a1a';
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 1;
        ctx.stroke();

        // заголовок
        ctx.font = 'bold 14px monospace';
        ctx.fillStyle = '#eee';
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillText(this.title, x + NODE_PAD, y + 0.75 * NODE_PAD + 0.5 * HEADER_H);

        // строки (переменная высота)
        let ry = y + NODE_PAD + HEADER_H + 0.5 * ROW_GAP;
        for (let i = 0; i < this.rows.length; i++) {
            const row   = this.rows[i];
            const lines = this._lines[i];
            const rowH  = Math.max(CHECK_SIZE, lines.length * TEXT_LINE_H);

            ctx.fillStyle = i % 2 ? '#28283a' : '#202030';
            ctx.fillRect(x + NODE_PAD, ry - 0.5 * ROW_GAP, w - 2 * NODE_PAD, rowH + ROW_GAP);

            // чекбоксы - по вертикали по центру строки
            const cbY = ry + (rowH - CHECK_SIZE) / 2;
            for (let c = 0; c < this.checkCols; c++) {
                const cbX = x + NODE_PAD + c * CHECK_COL_W + (CHECK_COL_W - CHECK_SIZE) / 2;
                const type = (row.checks && row.checks[c]) || 'todo';
                drawCheckbox(ctx, cbX, cbY, CHECK_SIZE, type);
            }

            // текст - блок строк по вертикали по центру
            const tx = x + NODE_PAD + this.checkCols * CHECK_COL_W + TEXT_PAD;
            const blockH = lines.length * TEXT_LINE_H;
            const y0 = ry + (rowH - blockH) / 2 + TEXT_LINE_H / 2;
            ctx.font = '13px monospace';
            ctx.fillStyle = '#eee';
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            for (let li = 0; li < lines.length; li++)
                ctx.fillText(lines[li], tx, y0 + li * TEXT_LINE_H);

            ry += rowH;
            if (i < this.rows.length - 1) ry += ROW_GAP;
        }
    }

    beginDrag(p, resizeThreshold = NODE_RESIZE_THRESHOLD) {
        const mode = this.rightEdge.closestOnSegment(p).dist <= resizeThreshold ? 'resize' : 'move';
        this._drag = {
            mode,
            startX: p.x,
            startY: p.y,
            originX: this.point.x,
            originY: this.point.y,
            originTextColW: this._effectiveTextW,
        };
    }
    endDrag() {
        this._drag = null;
    }

    rebase(p) {
        if (this._drag) {
            this._drag.startX = p.x;
            this._drag.startY = p.y;
            this._drag.originX = this.point.x;
            this._drag.originY = this.point.y;
            this._drag.originTextColW = this._effectiveTextW;
        }
    }

    move(p, snap = 0) {
        const d = this._drag;
        if (!d)
            return null;
        const dx = p.x - d.startX;
        const dy = p.y - d.startY;
        if (d.mode === 'move') {
            let x = d.originX + dx;
            let y = d.originY + dy;
            if (snap > 0) {
                x = Math.round(x / snap) * snap;
                y = Math.round(y / snap) * snap;
            }
            this.point.set(x, y);
        } else if (d.mode === 'resize') {
            this.textColW = Math.max(0, d.originTextColW + dx);
        }
        return { dx, dy };
    }
}

const GRID_DIVISIONS = 5;

function gridStep() {
    let step = 50;
    while (step * cam.k < 40) step *= 2;
    while (step * cam.k > 80) step /= 2;
    return step;
}

function substep() {
    return gridStep() / GRID_DIVISIONS;
}

let W = 0, H = 0;
const cam = { x: 0, y: 0, k: 1 };
let pan = null;

function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width  = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    render();
}

const tmp = new Point();
function screenToWorld(sx, sy) {
    return tmp.set((sx - cam.x) / cam.k, (sy - cam.y) / cam.k);
}

function worldPos(e) {
    const r = canvas.getBoundingClientRect();
    return screenToWorld(e.clientX - r.left, e.clientY - r.top);
}

function zoomAt(sx, sy, factor) {
    const newK = Math.max(0.1, Math.min(8, cam.k * factor));
    const f = newK / cam.k;
    cam.x = sx - f * (sx - cam.x);
    cam.y = sy - f * (sy - cam.y);
    cam.k = newK;
}

function drawGrid() {
    const wl = -cam.x / cam.k;
    const wt = -cam.y / cam.k;
    const wr = wl + W / cam.k;
    const wb = wt + H / cam.k;

    const step = gridStep();
    const sub  = step / GRID_DIVISIONS;

    // подсетка - тоньше и темнее
    ctx.strokeStyle = '#1d1d1d';
    ctx.lineWidth = 0.8 / cam.k;
    const xs0 = Math.floor(wl / sub) * sub;
    for (let x = xs0; x <= wr; x += sub) {
        ctx.beginPath(); ctx.moveTo(x, wt); ctx.lineTo(x, wb); ctx.stroke();
    }
    const ys0 = Math.floor(wt / sub) * sub;
    for (let y = ys0; y <= wb; y += sub) {
        ctx.beginPath(); ctx.moveTo(wl, y); ctx.lineTo(wr, y); ctx.stroke();
    }

    // основная сетка
    ctx.strokeStyle = '#242424';
    ctx.lineWidth = 1.2 / cam.k;
    const x0 = Math.floor(wl / step) * step;
    for (let x = x0; x <= wr; x += step) {
        ctx.beginPath(); ctx.moveTo(x, wt); ctx.lineTo(x, wb); ctx.stroke();
    }
    const y0 = Math.floor(wt / step) * step;
    for (let y = y0; y <= wb; y += step) {
        ctx.beginPath(); ctx.moveTo(wl, y); ctx.lineTo(wr, y); ctx.stroke();
    }
}

function drawInfo(lines) {
    const dpr = window.devicePixelRatio || 1;
    ctx.save();
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = '#eee';
    ctx.font = '14px monospace';
    let ty = 24;
    for (const line of lines) {
        ctx.fillText(line, 16, ty);
        ty += 20;
    }
    ctx.restore();
}

const A = new Point(1020, 320);
const B = new Point(1600, 620);
const P = new Point(400, 300);

const arrow    = new Arrow(A, B, 'AB');
const dropLine = new Line(P, new Point(), '');

function render() {
    const dpr = window.devicePixelRatio || 1;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.setTransform(dpr * cam.k, 0, 0, dpr * cam.k, dpr * cam.x, dpr * cam.y);

    drawGrid();
    for (const node of nodes) node.draw(ctx);
    arrow.draw(ctx);

    const proj = arrow.closest(P);

    dropLine.b.setFrom(proj);
    dropLine.draw(ctx, {
        color:      '#f80',
        dash:       [4, 4],
        startColor: '#f44', startRadius: 6,
        endColor:   '#f80', endRadius:   3,
    });

    const { X, Y, len } = arrow.segmentCoords(P);
    const closest = `${proj.line.name} (t = ${proj.t.toFixed(2)})`;

    drawInfo([
        `P = (${P.x.toFixed(1)}, ${P.y.toFixed(1)})`,
        `X = ${X.toFixed(1)}  Y = ${Y.toFixed(1)}  |AB| = ${len.toFixed(1)}`,
        `расстояние = ${proj.dist.toFixed(2)}  (до ${closest})`,
    ]);
}


const STORAGE_KEY = 'roadmap.v1';
let saveTimer = null;

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            cam: { x: cam.x, y: cam.y, k: cam.k },
            nodes: nodes.map(n => ({
                title: n.title,
                x: n.point.x,
                y: n.point.y,
                textColW: n.textColW,
            })),
            order: nodes.map(n => n.title),
        }));
    } catch {}
}

function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 300);
}

function loadState() {
    let raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch { return; }
    if (!raw) return;
    let state;
    try { state = JSON.parse(raw); } catch { return; }

    if (state.cam) {
        const c = state.cam;
        if (typeof c.x === 'number') cam.x = c.x;
        if (typeof c.y === 'number') cam.y = c.y;
        if (typeof c.k === 'number') cam.k = Math.max(0.1, Math.min(8, c.k));
    }

    const byTitle = new Map(nodes.map(n => [n.title, n]));

    if (Array.isArray(state.nodes)) {
        for (const s of state.nodes) {
            const node = byTitle.get(s.title);
            if (!node) continue;
            if (typeof s.x === 'number' && typeof s.y === 'number')
                node.point.set(s.x, s.y);
            if (typeof s.textColW === 'number')
                node.textColW = s.textColW;
        }
    }

    if (Array.isArray(state.order)) {
        const seen = new Set();
        const ordered = [];
        for (const t of state.order) {
            const n = byTitle.get(t);
            if (n && !seen.has(n)) { seen.add(n); ordered.push(n); }
        }
        for (const n of nodes) if (!seen.has(n)) ordered.push(n);
        nodes.splice(0, nodes.length, ...ordered);
    }
}

loadState();


const DRAG_ACTIVATE_MS = 150;  // сколько ждать до принудительной активации
const DRAG_ACTIVATE_PX = 16;   // или на сколько экранных пикселей сдвинуться

let activation = null;
let activeDrag = null;

function beginActivation(e) {
    activation = {
        startScreenX: e.clientX,
        startScreenY: e.clientY,
        startTime: performance.now(),
        activated: false,
    };
}

function checkActivation(e) {
    if (!activation || activation.activated) return true;
    const elapsed = performance.now() - activation.startTime;
    const dist = Math.hypot(
        e.clientX - activation.startScreenX,
        e.clientY - activation.startScreenY,
    );
    if (elapsed < DRAG_ACTIVATE_MS && dist < DRAG_ACTIVATE_PX)
        return false;
    activation.activated = true;

    // отсечь накопленное движение: старт "настоящего" drag'а - здесь
    if (pan) {
        pan.startX = e.clientX;
        pan.startY = e.clientY;
        pan.camX = cam.x;
        pan.camY = cam.y;
    }
    if (activeDrag)
        activeDrag.rebase(worldPos(e));
    return true;
}

function nodeAt(p, threshold) {
    for (let i = nodes.length - 1; i >= 0; i--) {
        const node = nodes[i];
        if (node.closest(p).dist <= threshold)
            return node;
    }
    return null;
}

function bringToFront(node) {
    const idx = nodes.indexOf(node);
    if (idx !== -1 && idx !== nodes.length - 1) {
        nodes.splice(idx, 1);
        nodes.push(node);
        return true;
    }
}

function updateCursor(p) {
    if (activeDrag) {
        canvas.style.cursor = activeDrag.dragMode === 'resize' ? 'ew-resize' : 'grabbing';
        return;
    }
    if (pan) {
        canvas.style.cursor = 'grabbing';
        return;
    }
    const node = nodeAt(p, NODE_HIT_THRESHOLD / cam.k);
    if (node) {
        const rHit = node.rightEdge.closestOnSegment(p);
        canvas.style.cursor = rHit.dist <= NODE_RESIZE_THRESHOLD / cam.k ? 'ew-resize' : 'grab';
    } else
        canvas.style.cursor = 'default';
}

canvas.addEventListener('pointerdown', e => {
    const p = worldPos(e);
    const node = nodeAt(p, NODE_HIT_THRESHOLD / cam.k);
    if (node) {
        if (bringToFront(node)) render();
        node.beginDrag(p, NODE_RESIZE_THRESHOLD / cam.k);
        activeDrag = node;
        updateCursor(p);
    } else {
        pan = { startX: e.clientX, startY: e.clientY, camX: cam.x, camY: cam.y };
        canvas.style.cursor = 'grabbing';
    }
    beginActivation(e);
    canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove', e => {
    if (!checkActivation(e)) {
        // ещё "клик": обновляем P и курсор, но ничего не двигаем
        const p = worldPos(e);
        P.setFrom(p);
        updateCursor(p);
        return;
    }

    if (pan) {
        cam.x = pan.camX + (e.clientX - pan.startX);
        cam.y = pan.camY + (e.clientY - pan.startY);
        P.setFrom(worldPos(e));
        render();
        return;
    }

    const p = worldPos(e);
    P.setFrom(p);
    if (activeDrag) activeDrag.move(p, substep());
    updateCursor(p);
    render();
});
canvas.addEventListener('pointerup', e => {
    if (activeDrag) {
        activeDrag.endDrag();
        activeDrag = null;
    } else if (pan)
        pan = null;
    else
        return;
    activation = null;
    canvas.releasePointerCapture(e.pointerId);
    updateCursor(worldPos(e));
    saveState();
});
canvas.addEventListener('pointercancel', () => {
    if (activeDrag) {
        activeDrag.endDrag();
        activeDrag = null;
    }
    if (pan)
        pan = null;
    activation = null;
    canvas.style.cursor = 'default';
});
canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const r = canvas.getBoundingClientRect();
    const sx = e.clientX - r.left;
    const sy = e.clientY - r.top;
    const dy = e.deltaMode === 1 ? e.deltaY * 16
             : e.deltaMode === 2 ? e.deltaY * 400
             : e.deltaY;
    zoomAt(sx, sy, Math.pow(1.1, -dy / 100));
    P.setFrom(worldPos(e));
    render();
    scheduleSave();
}, { passive: false }); // passive обязателен - без него preventDefault в wheel молча игнорируется
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('resize', resize);
resize();
</script>
</body>
